<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PantryPal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">🍳 PantryPal</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="recipes.html">Recipes</a>
            <a href="add-recipe.html">Add Recipe</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">

            <h1>What's in your kitchen?</h1>

            <p>
                Turn the ingredients you already have
                into something delicious.
            </p>

            <div class="ingredient-box">

                <input
                    type="text"
                    id="ingredientInput"
                    placeholder="Type an ingredient..."
                >

                <button onclick="addIngredient()">Add</button>

                <button onclick="findRecipes()">Find Recipes</button>

            </div>

            <div id="ingredientList" class="ingredient-list"></div>

            <button class="clear-button" onclick="clearIngredients()">
                Clear All
            </button>

        </div>
    </section>

    <section class="recipes-section">

        <h2 id="resultTitle">Popular Recipes</h2>

        <div id="recipeResults" class="recipe-container"></div>

    </section>

    <div id="recipeModal" class="modal">

        <div class="modal-content">

            <button class="close-button" onclick="closeRecipe()">×</button>

            <div id="modalEmoji" class="modal-emoji"></div>

            <h2 id="modalTitle"></h2>

            <p id="modalTime"></p>

            <h3>🥕 Ingredients</h3>
            <ul id="modalIngredients"></ul>

            <h3>👩‍🍳 How to Prepare</h3>
            <p id="modalSteps"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
