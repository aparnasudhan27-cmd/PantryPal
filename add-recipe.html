<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Recipe - PantryPal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">🍳 PantryPal</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="recipes.html">Recipes</a>
            <a href="add-recipe.html">Add Recipe</a>
        </div>

    </nav>


    <!-- Add Recipe Section -->
    <section class="add-recipe">

        <h2>Add Your Recipe 🍴</h2>

        <form onsubmit="submitRecipeForm(event)">

            <label for="recipeName">
                Recipe Name
            </label>

            <input
                type="text"
                id="recipeName"
                placeholder="Enter recipe name"
                required
            >


            <label for="recipeIngredients">
                Ingredients
            </label>

            <input
                type="text"
                id="recipeIngredients"
                placeholder="e.g. egg, rice, onion"
                required
            >


            <label for="cookingTime">
                Cooking Time
            </label>

            <input
                type="text"
                id="cookingTime"
                placeholder="e.g. 20 mins"
                required
            >


            <label for="recipeCategory">
                Category
            </label>

            <select id="recipeCategory" required>

                <option value="">
                    Select category
                </option>

                <option value="Breakfast">
                    Breakfast
                </option>

                <option value="Lunch">
                    Lunch
                </option>

                <option value="Dinner">
                    Dinner
                </option>

                <option value="Snacks">
                    Snacks
                </option>

                <option value="Drinks">
                    Drinks
                </option>

            </select>


            <label for="recipeSteps">
                Preparation Steps
            </label>

            <textarea
                id="recipeSteps"
                rows="5"
                placeholder="Describe how to prepare the recipe..."
                required
            ></textarea>


            <button type="submit">
                Add Recipe
            </button>

        </form>

    </section>


    <script>
        function submitRecipeForm(event) {

            event.preventDefault();

            alert("✅ Recipe added successfully!");

            event.target.reset();
        }
    </script>

</body>

</html>
