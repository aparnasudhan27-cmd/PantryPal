<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PantryPal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">🍳 PantryPal</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="recipes.html">Recipes</a>
            <a href="add-recipe.html">Add Recipe</a>
        </div>
    </nav>

    <section class="add-recipe">
        <h2>Welcome back 🍳</h2>

        <form data-endpoint="login.php" data-redirect="index.html">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <p id="formMessage" class="auth-message" role="alert"></p>

            <button type="submit">Log in</button>
        </form>

        <p class="auth-switch">New to PantryPal? <a href="register.html">Create an account</a></p>
    </section>

    <script src="auth.js"></script>
</body>

</html>
